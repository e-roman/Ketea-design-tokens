name: Redeploy docs

# Cada tag vX.Y.Z nuevo redespliega la documentación con esa versión de los tokens.
# Requiere el secret VERCEL_DEPLOY_HOOK (Settings → Secrets and variables → Actions).
on:
  push:
    tags: ["v*"]

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Vercel
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
